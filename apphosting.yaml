# Firebase App Hosting 백엔드 설정
# 배포 주소: https://albam--albam-416fd.asia-east1.hosted.app
#
# 아래 secret 3개는 소스에 값을 두지 않는다. 배포 전에 한 번만 등록:
#   firebase apphosting:secrets:set albam-admin-password
#   firebase apphosting:secrets:set albam-session-secret
#   firebase apphosting:secrets:set albam-macrodroid-token
#
# 값을 바꾼 뒤에는 **반드시 새 롤아웃을 만들어야** 적용된다.
# 아래 secret 값은 배포(롤아웃) 시점에 읽혀 환경변수로 굳어지기 때문이다.
#   firebase apphosting:rollouts:create albam -b main
# 자세한 절차는 README.md 6장 참고.

runConfig:
  # 주문이 몰리는 시즌 상품이라 0 → 스케일업을 허용하되 상한을 낮게 둔다.
  # (Blaze 요금제에서 예상치 못한 과금이 나지 않도록)
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # 가게 이름은 src/lib/brand.ts 에 있다. 환경변수로 두면 코드와 두 곳에서 어긋난다.

  # 빌드 캐시 깨기.
  # public/ 에 새로 넣은 파일이 배포에 안 실리는 일이 있었다(코드는 최신인데 파일만 옛것).
  # 이 값을 바꾸면 빌드 환경이 달라져 캐시를 다시 만든다. 같은 일이 또 나면 숫자를 올린다.
  - variable: BUILD_CACHE_BUST
    value: '2'
    availability:
      - BUILD


  # 관리자 공유 비밀번호 (아버지가 쓰는 그 비밀번호)
  - variable: ADMIN_PASSWORD
    secret: albam-admin-password
    availability:
      - RUNTIME

  # 관리자 세션 쿠키 서명 키
  - variable: SESSION_SECRET
    secret: albam-session-secret
    availability:
      - RUNTIME

  # MacroDroid가 입금 정보를 보낼 때 사용하는 토큰
  - variable: MACRODROID_TOKEN
    secret: albam-macrodroid-token
    availability:
      - RUNTIME
